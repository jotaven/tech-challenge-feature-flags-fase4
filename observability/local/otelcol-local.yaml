# OpenTelemetry Collector - configuração para teste local (Docker Compose)
#
# Mesmo desenho do cluster, trocando só os destinos:
#   métricas -> Prometheus (remote write)
#   logs     -> Loki (OTLP nativo)
#   traces   -> Jaeger local (no EKS, o destino é o New Relic)
#
# O connector spanmetrics gera métricas de taxa, erro e duração a partir dos
# traces, com o mesmo formato para os serviços Go e Python. Isso facilita o
# dashboard e a regra de alerta de 5xx.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25
  resource:
    attributes:
      - key: deployment.environment
        value: local
        action: upsert
  batch: {}

connectors:
  spanmetrics:
    namespace: traces.span.metrics
    metrics_flush_interval: 15s
    histogram:
      explicit:
        buckets: [10ms, 50ms, 100ms, 250ms, 500ms, 1s, 2s, 5s]
    dimensions:
      # semântica estável (Go/otelhttp) e antiga (instrumentação Python padrão)
      - name: http.response.status_code
      - name: http.status_code
      - name: http.request.method
      - name: http.method

exporters:
  debug:
    verbosity: basic
  prometheusremotewrite:
    endpoint: http://prometheus:9090/api/v1/write
    resource_to_telemetry_conversion:
      enabled: true
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp/jaeger, spanmetrics, debug]
    metrics:
      receivers: [otlp, spanmetrics]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheusremotewrite, debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp/loki, debug]
