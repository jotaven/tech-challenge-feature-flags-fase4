# OpenTelemetry Collector no EKS - values do chart open-telemetry/opentelemetry-collector
# Chart 0.174.2 (Collector 0.161.0). Aplicado pelo Argo CD:
#   gitops/argocd/monitoring-otel-collector.yaml
#
# Papel: peça central da telemetria (métricas, logs e traces).
#
#   Apps (OTLP) ──────────────► Collector ──► Prometheus (métricas, remote write)
#   Alloy (logs dos pods, OTLP) ─┘    │   ──► Loki (logs, OTLP nativo)
#                                     └──────► New Relic (traces, OTLP)
#
# - DaemonSet: um Collector por nó. Apps enviam para o Collector do próprio nó
#   (OTEL_EXPORTER_OTLP_ENDPOINT=http://$(HOST_IP):4317).
# - Logs: o Alloy lê os logs dos contêineres e encaminha por OTLP para o Service
#   togglemaster-otel-collector (internalTrafficPolicy Local = Collector do mesmo nó).
#   O filelog do chart fica desligado para não ler os mesmos arquivos duas vezes.
# - spanmetrics gera taxa, erro e duração por serviço a partir dos traces.
#
# Endereços conferidos com gitops/monitoring/grafana/values.yaml (27/10):
#   Prometheus: release togglemaster-prometheus (chart prometheus, remote write ligado)
#   Loki:       release togglemaster-loki (SingleBinary, sem gateway, porta 3100)

mode: daemonset

fullnameOverride: togglemaster-otel-collector

image:
  repository: otel/opentelemetry-collector-contrib

presets:
  logsCollection:
    enabled: false   # logs chegam pelo Alloy
  kubernetesAttributes:
    enabled: true

# Service para o Alloy encaminhar os logs. Em DaemonSet o chart usa
# internalTrafficPolicy: Local, então o tráfego fica no próprio nó.
service:
  enabled: true

# Só OTLP: desliga as portas de Jaeger e Zipkin que o chart abre por padrão.
ports:
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false

extraEnvs:
  - name: NEW_RELIC_LICENSE_KEY
    valueFrom:
      secretKeyRef:
        name: newrelic-license
        key: license-key
        optional: true

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 384Mi

config:
  receivers:
    # remove receivers padrão do chart que não usamos
    jaeger: null
    zipkin: null
    prometheus: null
    otlp:
      protocols:
        grpc:
          endpoint: ${env:MY_POD_IP}:4317
        http:
          endpoint: ${env:MY_POD_IP}:4318

  processors:
    resource:
      attributes:
        - key: deployment.environment
          value: homolog
          action: upsert

    # Logs do Alloy: os rótulos do Loki (container, pod, namespace) chegam como
    # atributos de cada linha. Este processor agrupa as linhas por contêiner e
    # sobe esses rótulos para o "resource", que é o que o Loki indexa.
    groupbyattrs/alloy:
      keys: [container, pod, namespace]

    # Ajusta os rótulos dos logs do Alloy:
    # - remove os k8s.* que o k8sattributes associou ao pod do Alloy (origem da conexão);
    # - grava os k8s.* corretos do pod que gerou o log;
    # - mantém service_name="togglemaster" e container=<serviço>, que são os
    #   rótulos usados pelo dashboard "Operations Center" do Grafana.
    transform/alloy:
      error_mode: ignore
      log_statements:
        - context: resource
          statements:
            - delete_matching_keys(attributes, "^k8s\\..*") where attributes["container"] != nil
            - set(attributes["k8s.container.name"], attributes["container"]) where attributes["container"] != nil
            - set(attributes["k8s.pod.name"], attributes["pod"]) where attributes["pod"] != nil
            - set(attributes["k8s.namespace.name"], attributes["namespace"]) where attributes["namespace"] != nil
            - set(attributes["service.name"], "togglemaster") where attributes["container"] != nil
            - delete_key(attributes, "pod")
            - delete_key(attributes, "namespace")

  connectors:
    spanmetrics:
      namespace: traces.span.metrics
      metrics_flush_interval: 15s
      histogram:
        explicit:
          buckets: [10ms, 50ms, 100ms, 250ms, 500ms, 1s, 2s, 5s]
      dimensions:
        - name: http.response.status_code
        - name: http.status_code
        - name: http.request.method
        - name: http.method

  exporters:
    prometheusremotewrite:
      endpoint: http://togglemaster-prometheus-server.monitoring.svc.cluster.local/api/v1/write
      resource_to_telemetry_conversion:
        enabled: true
    otlphttp/loki:
      endpoint: http://togglemaster-loki.monitoring.svc.cluster.local:3100/otlp
    otlphttp/newrelic:
      endpoint: https://otlp.nr-data.net
      headers:
        api-key: ${env:NEW_RELIC_LICENSE_KEY}

  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, resource, batch]
        exporters: [otlphttp/newrelic, spanmetrics]
      metrics:
        receivers: [otlp, spanmetrics]
        processors: [memory_limiter, resource, batch]
        exporters: [prometheusremotewrite]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, groupbyattrs/alloy, transform/alloy, resource, batch]
        exporters: [otlphttp/loki]
