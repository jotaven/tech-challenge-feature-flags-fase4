controller:
  type: deployment
  replicas: 1

alloy:
  configMap:
    content: |
      discovery.kubernetes "togglemaster" {
        role = "pod"
        namespaces {
          names = ["togglemaster"]
        }
      }

      discovery.relabel "togglemaster" {
        targets = discovery.kubernetes.togglemaster.targets

        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
      }

      loki.source.kubernetes "togglemaster" {
        targets    = discovery.relabel.togglemaster.output
        forward_to = [otelcol.receiver.loki.collector.receiver]
      }

      // Fase 4: os logs passam pelo OpenTelemetry Collector antes do Loki.
      // O Collector define service_name="togglemaster" e container=<serviço>,
      // mantendo as consultas do dashboard.
      otelcol.receiver.loki "collector" {
        output {
          logs = [otelcol.exporter.otlp.collector.input]
        }
      }

      otelcol.exporter.otlp "collector" {
        client {
          endpoint = "togglemaster-otel-collector.monitoring.svc.cluster.local:4317"
          tls {
            insecure = true
          }
        }
      }
