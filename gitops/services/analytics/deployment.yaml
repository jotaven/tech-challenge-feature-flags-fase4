apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: togglemaster
  labels:
    app.kubernetes.io/name: analytics-service
    app.kubernetes.io/part-of: togglemaster
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: analytics-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: analytics-service
        app.kubernetes.io/part-of: togglemaster
    spec:
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: analytics-service
      serviceAccountName: analytics-service
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: analytics-service
        image: 966523587984.dkr.ecr.us-east-1.amazonaws.com/togglemaster-analytics:6990e5c6923af288f57a3c7d0750052af525820d
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8005
        env:
        # OpenTelemetry: envia para o Collector (DaemonSet) do próprio nó.
        # HOST_IP precisa vir antes do endpoint para a expansão $(HOST_IP).
        - name: HOST_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://$(HOST_IP):4317"
        - name: OTEL_SERVICE_NAME
          value: "analytics-service"
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "service.namespace=togglemaster,deployment.environment=homolog"
        - name: PORT
          value: "8005"
        - name: AWS_REGION
          value: "us-east-1"
        - name: AWS_SQS_URL
          value: "https://sqs.us-east-1.amazonaws.com/966523587984/togglemaster-analytics"
        - name: AWS_DYNAMODB_TABLE
          value: "ToggleMasterAnalytics"
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /live
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: temporary-files
          mountPath: /tmp
      volumes:
      - name: temporary-files
        emptyDir: {}
