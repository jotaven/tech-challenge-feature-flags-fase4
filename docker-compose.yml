services:

  postgres-auth:
    image: postgres:16
    container_name: postgres-auth
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: auth_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
      - ./auth-service/db/init.sql:/docker-entrypoint-initdb.d/01-auth.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-main:
    image: postgres:16
    container_name: postgres-main
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: flags_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_main_data:/var/lib/postgresql/data
      - ./flag-service/db/init.sql:/docker-entrypoint-initdb.d/01-flags.sql:ro
      - ./targeting-service/db/init.sql:/docker-entrypoint-initdb.d/02-targeting.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d flags_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  localstack:
    image: localstack/localstack:4.14.0
    container_name: localstack
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      SERVICES: sqs,dynamodb
      AWS_DEFAULT_REGION: us-east-1
      LOCALSTACK_HOST: localstack:4566
      SQS_ENDPOINT_STRATEGY: path
    volumes:
      - ./localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  auth-service:
    build: ./auth-service
    container_name: auth-service
    environment:
      PORT: 8001
      DATABASE_URL: postgres://admin:admin123@postgres-auth:5432/auth_db?sslmode=disable
      MASTER_KEY: admin-secreto-123
    ports:
      - "8001:8001"
    depends_on:
      postgres-auth:
        condition: service_healthy

  flag-service:
    build: ./flag-service
    container_name: flag-service
    environment:
      PORT: 8002
      DATABASE_URL: postgres://admin:admin123@postgres-main:5432/flags_db
      AUTH_SERVICE_URL: http://auth-service:8001
      OTEL_SERVICE_NAME: flag-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=togglemaster,deployment.environment=local
    ports:
      - "8002:8002"
    depends_on:
      postgres-main:
        condition: service_healthy
      auth-service:
        condition: service_started

  targeting-service:
    build: ./targeting-service
    container_name: targeting-service
    environment:
      PORT: 8003
      DATABASE_URL: postgres://admin:admin123@postgres-main:5432/flags_db
      AUTH_SERVICE_URL: http://auth-service:8001
      OTEL_SERVICE_NAME: targeting-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=togglemaster,deployment.environment=local
    ports:
      - "8003:8003"
    depends_on:
      postgres-main:
        condition: service_healthy
      auth-service:
        condition: service_started

  evaluation-service:
    build: ./evaluation-service
    container_name: evaluation-service
    environment:
      PORT: 8004
      REDIS_URL: redis://redis:6379
      FLAG_SERVICE_URL: http://flag-service:8002
      TARGETING_SERVICE_URL: http://targeting-service:8003
      SERVICE_API_KEY: temp-key
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_SQS_URL: http://localstack:4566/queue/us-east-1/000000000000/togglemaster-analytics
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - "8004:8004"
    depends_on:
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
      flag-service:
        condition: service_started
      targeting-service:
        condition: service_started

  analytics-service:
    build: ./analytics-service
    container_name: analytics-service
    environment:
      PORT: 8005
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_SQS_URL: http://localstack:4566/queue/us-east-1/000000000000/togglemaster-analytics
      AWS_DYNAMODB_TABLE: ToggleMasterAnalytics
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      OTEL_SERVICE_NAME: analytics-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=togglemaster,deployment.environment=local
    ports:
      - "8005:8005"
    depends_on:
      localstack:
        condition: service_healthy

volumes:
  postgres_auth_data:
  postgres_main_data:
  localstack_data:
